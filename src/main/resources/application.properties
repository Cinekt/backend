spring.application.name=cinekt

# Spring DataSource Configuration
spring.datasource.url=jdbc:mysql://localhost:3306/cinekt
spring.datasource.username=${DB_USERNAME}
spring.datasource.password=${DB_PASSWORD}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# Spring Data JPA and Hibernate Configuration
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQLDialect
spring.jpa.hibernate.naming.physical-strategy=com.jacobo.cinekt.shared.infrastructure.persistence.jpa.configuration.strategy.SnakeCaseWithPluralizedTablePhysicalNamingStrategy

# Project Information and Swagger UI
app.api.description=Plantilla base con Spring Security y JWT para autenticación, autorización y gestión de usuarios.
app.api.version=1.0.0

# JWT Configuration properties
authorization.jwt.secret=${JWT_SECRET}
authorization.jwt.expiration.days=${JWT_EXPIRATION_DAYS}

